services:

  db:
    image: mysql:8.0
    container_name: hotel_mysql
    restart: always

    environment:
      MYSQL_DATABASE: hotel_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: hotel_user
      MYSQL_PASSWORD: root

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: hotel_redis
    restart: always

    ports:
      - "6379:6379"

  web:
    build: .
    container_name: hotel_django

    command: gunicorn hotel_management.wsgi:application --bind 0.0.0.0:8000

    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - db
      - redis

  celery:
    build: .
    container_name: hotel_celery

    command: celery -A hotel_management worker --loglevel=info

    volumes:
      - .:/app

    env_file:
      - .env

    depends_on:
      - db
      - redis

  celery-beat:
    build: .
    container_name: hotel_beat

    command: celery -A hotel_management beat --loglevel=info

    volumes:
      - .:/app

    env_file:
      - .env

    depends_on:
      - db
      - redis

  nginx:
    build: ./nginx
    container_name: hotel_nginx
    ports:
      - "80:80"
  
    depends_on:
      - web
    
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

volumes:

  mysql_data:

  static_volume:
  
  media_volume:

