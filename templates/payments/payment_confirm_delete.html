{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="card">

        <div class="card-header bg-danger text-white">

            <h4>Delete Payment</h4>

        </div>

        <div class="card-body">

            <p>

                Are you sure you want to delete

                <strong>

                    {{ payment.invoice_number }}

                </strong>?

            </p>

            <form method="POST">

                {% csrf_token %}

                <button
                    type="submit"
                    class="btn btn-danger">

                    Yes, Delete

                </button>

                <a
                    href="{% url 'payment_list' %}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
